name: Build LocalMapUpgrade

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply fix (ignore button release as place-marker click)
        shell: pwsh
        run: |
          $patch = @'
          diff --git a/source/Hooks.cpp b/source/Hooks.cpp
          index 4f93ce7..1471025 100644
          --- a/source/Hooks.cpp
          +++ b/source/Hooks.cpp
          @@ -177,7 +177,20 @@ bool ProcessButton(RE::LocalMapMenu::InputHandler* a_localMapInputHandler, RE::B
           			{
           				auto playerSetMarkerManager = LMU::PlayerSetMarkerManager::GetSingleton();
           
          -				if (playerSetMarkerManager->CanPlaceMarker())
          +				// Act only on a fresh press. The button that picked "Map" in the pause/tween menu is
          +				// still down when the map opens, so its RELEASE (Value() == 0) reaches this handler
          +				// while allowPlaceMarker is still true - and was treated as a placement click, which
          +				// opened the "What do you want to do with this marker?" prompt (or silently dropped a
          +				// marker) right after opening the map. The vanilla world map ignores that release;
          +				// this local-map path did not.
          +				if (!buttonEvent->IsDown())
          +				{
          +					if (buttonEvent->IsUp())
          +					{
          +						playerSetMarkerManager->AllowPlaceMarker();
          +					}
          +				}
          +				else if (playerSetMarkerManager->CanPlaceMarker())
           				{ 
           					float wndPointX{};
           					float wndPointY{};
          '@
          Set-Content -Path fix.patch -Value $patch -Encoding utf8NoBOM
          git apply --ignore-whitespace fix.patch
          if ($LASTEXITCODE -ne 0) { throw "fix.patch did not apply; refusing to build an unpatched DLL" }
          Write-Host "Patch applied"

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # vcpkg scripts from release tag 2026.07.29: the Feb-2024 scripts at the old baseline fetch msys2
      # packages by hard-coded URL, and msys2 has deleted those files (404). Port versions stay pinned
      # by builtin-baseline in vcpkg.json.
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ runner.workspace }}/vcpkg
          vcpkgGitCommitId: c76c06644034521fb761a39f8f52d8e87d1103d5

      # run-vcpkg exports VCPKG_BINARY_SOURCES=x-gha, but the GHA cache tokens are not exposed to
      # run steps any more, so vcpkg dies with "requires ACTIONS_RUNTIME_TOKEN". Use a plain
      # files cache instead, saved/restored with actions/cache.
      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\vcpkg-bincache
          key: vcpkg-bin-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'cmake/ports/**') }}
          restore-keys: vcpkg-bin-${{ runner.os }}-

      - name: Configure
        shell: pwsh
        env:
          VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\vcpkg-bincache,readwrite
        run: cmake --preset build-relwithdebinfo-se-only

      - name: Build
        shell: pwsh
        env:
          VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\vcpkg-bincache,readwrite
        run: cmake --build build/relwithdebinfo-se-only

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: LocalMapUpgrade
          if-no-files-found: error
          path: |
            build/relwithdebinfo-se-only/LocalMapUpgrade.dll
            build/relwithdebinfo-se-only/LocalMapUpgrade.pdb
